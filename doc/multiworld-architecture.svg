<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Multiworld server architecture</title>
  <desc id="d">One UDP socket feeds a ClusterReceive thread, which routes packets by peer into the inboxes of the world threads. Each world has its own Lua state, map, emerge threads and databases, and sends directly to the shared connection. All worlds share the auth database, ban list, main.conf and IPC store.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4252"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f8f6b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="530" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- UDP socket -->
  <rect x="200" y="24" width="360" height="62" rx="8" fill="#e8f1fb" stroke="#3b74b8" stroke-width="1.5"/>
  <text x="380" y="52" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">UDP socket</text>
  <text x="380" y="72" text-anchor="middle" font-size="13" fill="#4a5360">MTP connections, shared and thread-safe</text>

  <!-- socket -> cluster -->
  <line x1="380" y1="86" x2="380" y2="134" stroke="#3b4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="392" y="115" font-size="12" fill="#4a5360">incoming packets</text>

  <!-- ClusterReceive -->
  <rect x="200" y="136" width="360" height="62" rx="8" fill="#f0eafa" stroke="#7a5bb5" stroke-width="1.5"/>
  <text x="380" y="164" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">ClusterReceive thread</text>
  <text x="380" y="184" text-anchor="middle" font-size="13" fill="#4a5360">routes packets by peer</text>

  <!-- cluster -> worlds -->
  <line x1="300" y1="198" x2="200" y2="270" stroke="#3b4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="460" y1="198" x2="560" y2="270" stroke="#3b4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="232" y="228" text-anchor="end" font-size="12" fill="#4a5360">inbox</text>
  <text x="528" y="228" text-anchor="start" font-size="12" fill="#4a5360">inbox</text>

  <!-- World A -->
  <rect x="50" y="272" width="300" height="132" rx="8" fill="#e6f5ef" stroke="#2f8f6b" stroke-width="1.5"/>
  <text x="200" y="298" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">World A thread</text>
  <text x="200" y="318" text-anchor="middle" font-size="12" fill="#4a5360">one Server instance, with its own:</text>
  <text x="200" y="342" text-anchor="middle" font-size="13" fill="#1f2328">Lua state and environment</text>
  <text x="200" y="362" text-anchor="middle" font-size="13" fill="#1f2328">map</text>
  <text x="200" y="382" text-anchor="middle" font-size="13" fill="#1f2328">emerge threads and databases</text>

  <!-- World B -->
  <rect x="410" y="272" width="300" height="132" rx="8" fill="#e6f5ef" stroke="#2f8f6b" stroke-width="1.5"/>
  <text x="560" y="298" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">World B thread</text>
  <text x="560" y="318" text-anchor="middle" font-size="12" fill="#4a5360">one Server instance, with its own:</text>
  <text x="560" y="342" text-anchor="middle" font-size="13" fill="#1f2328">Lua state and environment</text>
  <text x="560" y="362" text-anchor="middle" font-size="13" fill="#1f2328">map</text>
  <text x="560" y="382" text-anchor="middle" font-size="13" fill="#1f2328">emerge threads and databases</text>

  <!-- direct sends back to the socket -->
  <path d="M50,338 H24 V55 H198" fill="none" stroke="#2f8f6b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-dash)"/>
  <path d="M710,338 H736 V55 H562" fill="none" stroke="#2f8f6b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-dash)"/>
  <text transform="translate(40,200) rotate(-90)" text-anchor="middle" font-size="12" fill="#2f8f6b">sends go directly to the socket</text>
  <text transform="translate(722,200) rotate(90)" text-anchor="middle" font-size="12" fill="#2f8f6b">sends go directly to the socket</text>

  <!-- worlds -> shared -->
  <line x1="200" y1="404" x2="200" y2="438" stroke="#8a8f98" stroke-width="1.5"/>
  <line x1="560" y1="404" x2="560" y2="438" stroke="#8a8f98" stroke-width="1.5"/>

  <!-- Shared -->
  <rect x="50" y="438" width="660" height="58" rx="8" fill="#fcf3df" stroke="#b8892b" stroke-width="1.5"/>
  <text x="380" y="463" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Shared by all worlds</text>
  <text x="380" y="483" text-anchor="middle" font-size="13" fill="#1f2328">SharedAuthDatabase · ban list · main.conf · IPC store</text>

  <!-- legend -->
  <line x1="50" y1="512" x2="84" y2="512" stroke="#3b4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="92" y="516" font-size="12" fill="#4a5360">receiving</text>
  <line x1="170" y1="512" x2="204" y2="512" stroke="#2f8f6b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-dash)"/>
  <text x="212" y="516" font-size="12" fill="#4a5360">sending</text>
</svg>
