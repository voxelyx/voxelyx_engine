name: linux

# build on c/cpp changes or workflow changes
on:
  push:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'client/shaders/**'
      - 'util/ci/**'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'client/shaders/**'
      - 'util/ci/**'
      - '.github/workflows/linux.yml'

env:
  VOXELYX_POSTGRESQL_CONNECT_STRING: 'host=localhost user=voxelyx password=voxelyx dbname=voxelyx'

jobs:
  # Older gcc version (should be close to our minimum supported version)
  gcc_9:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: |
          source ./util/ci/common.sh
          install_linux_deps g++-9

      - name: Build
        run: |
          ./util/ci/build.sh
        env:
          CC: gcc-9
          CXX: g++-9
          CMAKE_FLAGS: '-DCMAKE_C_FLAGS="-fsanitize=address" -DCMAKE_CXX_FLAGS="-fsanitize=address"'

      - name: Unittest
        run: |
          ./bin/voxelyx --run-unittests

      # Do this here because we have ASan and error paths are sensitive to dangling pointers
      - name: Install deps
        run: |
          source ./util/ci/common.sh
          install_linux_deps --sdl3 g++-16 libluajit-5.1-dev

      - name: Build
        run: |
          ./util/ci/build.sh
        env:
          CC: gcc-16
          CXX: g++-16
          # just to check that this compiles correctly
          CMAKE_FLAGS: '-DBUILD_BENCHMARKS=1 -DUSE_SDL3=1'

      - name: Test
        run: |
          mkdir nowrite
          chmod a-w nowrite
          cd nowrite
          ../bin/voxelyx --run-unittests

  # Older clang version (should be close to our minimum supported version)
  clang_11:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: |
          source ./util/ci/common.sh
          install_linux_deps clang-11 xvfb

      - name: Build
        run: |
          ./util/ci/build.sh
        env:
          CC: clang-11
          CXX: clang++-11
          # Test fallback SHA implementations, add GLES for the test
          CMAKE_FLAGS: '-DENABLE_OPENSSL=0 -DENABLE_GLES2=ON'

      - name: Test
        run: |
          ./bin/voxelyx --run-unittests

      - name: Install deps
        run: |
          source ./util/ci/common.sh
          install_linux_deps clang-22 lldb xvfb

      - name: Build
        run: |
          ./util/ci/build.sh
        env:
          CC: clang-22
          CXX: clang++-22

      - name: Test
        run: |
          ./bin/voxelyx --run-unittests

      - name: Install deps
        run: |
          source ./util/ci/common.sh
          install_linux_deps --headless clang libluajit-5.1-dev

      - name: Build prometheus-cpp
        run: ./util/ci/build_prometheus_cpp.sh

      - name: Build
        run: |
          ./util/ci/build.sh
        env:
          CC: clang
          CXX: clang++
          CMAKE_FLAGS: "-DENABLE_PROMETHEUS=1 -DBUILD_CLIENT=0 -DENABLE_CURSES=0"

      - name: Test
        run: |
          ./bin/voxelyxserver --run-unittests
